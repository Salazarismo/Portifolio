name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    working-directory: adorable-azimuth

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: adorable-azimuth/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Astro Check
        run: pnpm run check
      - name: i18n Keys Check
        run: pnpm run check:i18n
      - name: Build
        run: pnpm run build
      # Não-bloqueante: 791 violações pré-existentes (dívida documentada em
      # docs/modulos/qualidade/REGRA.md). Tornar bloqueante após o refactor.
      - name: Tokens Gate (informativo)
        run: pnpm run tokens:gate
        continue-on-error: true
      - name: Islands Gate
        run: pnpm run islands:gate
      - name: Semantics Gate
        run: node scripts/semantics-gate.cjs
      - name: Projects Gate
        run: node scripts/projects-gate.cjs
      - name: JS Budget Gate
        run: node scripts/js-budget.cjs
      - name: Docs Gate
        run: node scripts/docs-gate.cjs
